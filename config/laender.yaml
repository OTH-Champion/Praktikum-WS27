    name: Schweiz
    kontinent: Europa
    namen: [Switzerland, Schweiz, Suisse, Svizzera, Suiza, CHE]
    visum: false
    erasmus: "2027"
    visum_text: >-
      Kein Visum. Für Praktika zwischen drei und zwölf Monaten ist eine Kurzaufenthaltsbewilligung
      L EU/EFTA nötig (läuft über Arbeitgeber und Wohngemeinde); unter drei Monaten reicht das
      Online-Meldeverfahren. Erasmus+: Die Schweiz soll ab 2027 wieder teilnehmen (Abkommen im
      November 2025 unterzeichnet, Finanzierung durch das Parlament noch offen).
    links:
      - {t: "Staatssekretariat für Migration: Bewilligung L EU/EFTA", u: "https://www.sem.admin.ch/sem/en/home/themen/aufenthalt/eu_efta/ausweis_l_eu_efta.html"}
