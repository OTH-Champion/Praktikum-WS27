      - {t: "Auswärtiges Amt: Reise- und Sicherheitshinweise", u: "https://www.auswaertiges-amt.de/de/reiseundsicherheit/grossbritanniensicherheit-206408"}
    foerderung: [erasmus, auslandsbafoeg, promos]

