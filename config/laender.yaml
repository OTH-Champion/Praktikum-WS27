  GB:
    name: Vereinigtes Königreich
    kontinent: Europa
    namen: [United Kingdom, UK, U.K., Great Britain, Großbritannien, Grossbritannien, England, Scotland, Wales, Northern Ireland, Vereinigtes Königreich, Reino Unido, GBR]
    visum: true
    erasmus: "2027"
    visum_text: >-
      Visum nötig. Für Praktika gibt es das „Government Authorised Exchange (Temporary Work)“-Visum
      über einen zugelassenen Sponsor bzw. Programmträger, maximal 12 Monate. Kosten: Visagebühr
      (2026 rund 340 £) plus Gesundheitszuschlag (IHS), außerdem Nachweis von rund 1.270 £ Rücklagen.
      Mit der normalen Einreise als Besucher (ETA) ist kein Praktikum erlaubt. Ein Jugendmobilitätsprogramm
      zwischen EU und UK wird verhandelt, gilt aber noch nicht. Erasmus+: Das UK nimmt ab dem
      Studienjahr 2027/28 wieder teil.
    links:
      - {t: "GOV.UK: Government Authorised Exchange visa", u: "https://www.gov.uk/government-authorised-exchange"}
