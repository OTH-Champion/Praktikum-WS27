# ---------------------------------------------------------------- Förderungen
# regionen: [alle] = überall im Ausland; sonst Länder-Codes oder Kontinente
foerderungen:
  erasmus:
    name: Erasmus+ Praktikum (über die OTH)
    regionen: [EU, EWR, "UK/CH ab 2027/28 voraussichtlich"]
    text: >-
      Zuschuss für Praktika ab 2 Monaten in Vollzeit (mind. 35 Std./Woche) in Erasmus+-Ländern.
      Im OTH-Projekt 2025–27 sind es 690–750 € pro Monat je nach Land, dazu Aufschläge z. B. für
      Erstakademiker:innen oder bei Anreise mit Bahn/Bus. Bei einer Vergütung ab 1.000 € brutto
      fördert die OTH nur die halbe Dauer (max. 3 Monate). Bewerbung über Mobility Online vor
      Praktikumsbeginn.
    links:
      - {t: "OTH: Erasmus+ Auslandspraktikum", u: "https://www.oth-regensburg.de/studieren/international/erasmus/fuer-studierende/auslandspraktikum"}
      - {t: "OTH: Merkblatt Erasmus+ Praktikum 2025–27 (PDF)", u: "https://www.oth-regensburg.de/fileadmin/Bereiche/International_Office/Erasmus/Merkblatt_ERASMUS_Praktikum_2025_27.pdf"}
      - {t: "DAAD: Erasmus+ für Studierende", u: "https://eu.daad.de/infos-fuer-einzelpersonen/foerderung-fuer-studierende-und-graduierte/de/"}
  promos:
    name: PROMOS (DAAD, über die OTH)
    regionen: [vor allem außerhalb Europas]
    text: >-
      Stipendium für Praktika vor allem außerhalb Europas, vergeben durch das International Office
      der OTH. Bewerbung über Mobility Online; den Registrierungslink gibt es bei
      outgoing-praktikum@oth-regensburg.de.
    links:
      - {t: "OTH: Finanzierung Auslandspraktikum", u: "https://www.oth-regensburg.de/studieren/international/auslandspraktikum/finanzierung"}
      - {t: "DAAD: PROMOS", u: "https://www.daad.de/de/infos-services-fuer-hochschulen/weiterfuehrende-infos-zu-daad-foerderprogrammen/promos/"}
  auslandsbafoeg:
    name: Auslands-BAföG für Pflichtpraktika
    regionen: [alle]
    text: >-
      Pflichtpraktika im Ausland ab 12 Wochen sind weltweit förderfähig. Wegen höherer Bedarfssätze
      (Reisekosten, Krankenversicherung, ggf. Auslandszuschlag) lohnt der Antrag oft auch für
      Studierende ohne Inlands-BAföG. Zuständig ist ein Amt je Zielland; Antrag mehrere Monate vorher stellen.
    links:
      - {t: "BAföG: zuständiges Amt je Zielland (Weltkarte)", u: "https://www.xn--bafg-7qa.de/SiteGlobals/Forms/bafoeg/weltkarte/weltkarte_formular.html"}
  baylat:
    name: BAYLAT Mobilitätsbeihilfe (Lateinamerika)
    regionen: [Südamerika]
    text: Bayerisches Hochschulzentrum für Lateinamerika; fördert u. a. Praktika von Studierenden bayerischer Hochschulen in Lateinamerika.
    links:
      - {t: "BAYLAT: Mobilitätsbeihilfe", u: "https://www.baylat.org/foerderprogramme/baylat-mobilitaetsbeihilfe.html"}
  baychina:
    name: BayCHINA Mobilitätszuschuss
    regionen: [China, Hongkong]
    text: Bayerisches Hochschulzentrum für China; fördert Praktika, Studienaufenthalte und Abschlussarbeiten mit Ziel China.
    links:
      - {t: "BayCHINA: Angebote für Studierende", u: "https://www.baychina.de/fuer-studierende"}
  dfjw:
    name: Deutsch-Französisches Jugendwerk
    regionen: [Frankreich]
    text: Fördert fachbezogene Praktika in Frankreich.
    links:
      - {t: "DFJW", u: "http://www.dfjw.org/"}

