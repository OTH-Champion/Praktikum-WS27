# Länder, Städte, Visa und Förderungen für Praktikum WS27
# ----------------------------------------------------------
# Stand der Recherche: November 2026, ohne Gewähr. Alle Angaben gelten für
# deutsche Staatsangehörige und ein Pflichtpraktikum von 20–22 Wochen.
#
# Aufbau je Land:
#   name        Anzeigename (deutsch)
#   kontinent   Europa | Südamerika | Ozeanien | Asien
#   namen       weitere Schreibweisen, an denen das Land in Stellenanzeigen erkannt wird
#   staedte     NUR wenn gesetzt: nur diese Städte zählen (z. B. Hubs in Asien).
#               Format  Anzeigename: [weitere Schreibweisen]
#   vorlage     übernimmt visum/visum_text/links/foerderung aus "vorlagen" (eigene Angaben gehen vor)
#   visum       true = Visum bzw. Aufenthaltstitel nötig
#   erasmus     true | "2027" (voraussichtlich ab Studienjahr 2027/28) | false
#   visum_text  Kurzinfo (wird auf der Seite angezeigt)
#   links       verlässliche Infoseiten (Behörden, Botschaften, Auswärtiges Amt)
#   foerderung  Schlüssel aus dem Abschnitt "foerderungen" unten

stand: "November 2026"

kontinente: [Europa, Südamerika, Ozeanien, Asien]

vorlagen:
  eu:
    visum: false
    erasmus: true
    visum_text: >-
      Kein Visum und keine Arbeitserlaubnis nötig (EU-Freizügigkeit). Bei mehr als drei Monaten
      Aufenthalt verlangen viele Länder eine Anmeldung bei der örtlichen Behörde.
      Krankenversicherung: Europäische Krankenversicherungskarte (EHIC) der Krankenkasse,
      ggf. Auslandszusatzversicherung.
    links:
      - {t: "Your Europe: Praktikum im EU-Ausland", u: "https://europa.eu/youreurope/citizens/education/traineeships/index_de.htm"}
      - {t: "Europäisches Jugendportal: Praktika im Ausland", u: "https://youth.europa.eu/go-abroad/traineeships_de"}
    foerderung: [erasmus, auslandsbafoeg]
  whv:
    visum: true
    erasmus: false
    foerderung: [promos, auslandsbafoeg]

