      Working Holiday Visa (Subclass 417): für Deutsche seit 1. Juli 2026 bis zum 35. Lebensjahr
      (vorher 30), bis zu 12 Monate. Beim selben Arbeitgeber höchstens 6 Monate, das passt für
      20–22 Wochen. Alternative mit Sponsor: Training Visa (Subclass 407).
    links:
      - {t: "Home Affairs: Work and Holiday visa (subclass 417)", u: "https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/work-holiday-417"}
