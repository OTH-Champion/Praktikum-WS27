# Firmenliste für Praktikum WS27
# --------------------------------
# Neue Firma: Block kopieren, Name und Adresse der Karriereseite eintragen, "Commit changes".
# enabled: false  -> Firma wird (vorübergehend) nicht abgefragt, erscheint aber in der Firmenliste.
#
# Das Feld "ats" sagt, welches Bewerbermanagement-System die Firma nutzt. Bei diesen Systemen
# reicht die Adresse, alles Weitere passiert automatisch (genaue Daten, kein Browser nötig):
#
#   ats             url (Beispiel)
#   workday         https://firma.wd3.myworkdayjobs.com/External
#   successfactors  https://jobs.firma.com            (Seiten mit /search/?q=... und /job/...)
#   smartrecruiters https://jobs.smartrecruiters.com/FirmaId
#   greenhouse      https://boards.greenhouse.io/firma
#   lever           https://jobs.lever.co/firma
#   ashby           https://jobs.ashbyhq.com/firma
#   personio        https://firma.jobs.personio.de
#   recruitee       https://firma.recruitee.com
#   eightfold       https://jobs.firma.com/careers    (zusätzlich domain: firma.com)
#   phenom          https://careers.firma.com/global/en/search-results
#   oracle          https://jobs.firma.com/en/sites/CX_1   (optional api_host)
#   radancy         https://careers.firma.com/en/search-jobs
#   pinpoint        https://careers.firma.com
#   browser         Karriereseite ohne passende Schnittstelle: echter Browser wie bei StudiJobs RGB,
#                   braucht list_url und job_link (Regex für Links zu einzelnen Stellen)
#
# Optional für alle:
#   career_url    Link, der auf der Seite bei "Berücksichtigte Unternehmen" erscheint
#   suchbegriffe  eigene Suchbegriffe statt der aus settings.yaml
#   urls          mehrere Stellenbörsen derselben Firma (statt url)
#   unterfirmen   Tochterfirmen auf derselben Stellenbörse: {Name: Regex}; Treffer im Titel/Ort/Text
#                 werden unter diesem Namen geführt (z. B. Bayernwerk bei E.ON)

