name: Testlauf (ohne Veröffentlichung)

# Liest nur die Stellenlisten ausgewählter Firmen und zeigt das Ergebnis im Log.
# Ändert nichts an der Website und läuft unabhängig vom regulären Update.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Firmen, z. B. Lufthansa Honda (Namen mit Leerzeichen: slug, z. B. mtu-aero-engines)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Stellenlisten lesen
        env:
          IN_ONLY: ${{ inputs.only }}
        run: |
          read -ra ONLY <<< "$IN_ONLY"
          python -m scraper.run --list-only --only "${ONLY[@]}"
