name: ATS-Probe (Hilfslauf)

on:
  push:
    branches: [main]
    paths:
      - "probe/firms.txt"
      - "probe/probe.py"
      - "probe/trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright && python -m playwright install --with-deps chromium
      - run: python probe/probe.py $(cat probe/only 2>/dev/null || true) 2>&1 | tail -150
      - run: cat probe/result.txt
      - name: Ergebnis speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898248+github-actions[bot]@users.noreply.github.com"
          git add probe/result.json probe/result.txt probe/shots
          git commit -m "ATS-Probe Ergebnis" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
